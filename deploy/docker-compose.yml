services:
  signaling:
    build:
      context: ..
      dockerfile: deploy/signaling.Dockerfile
    restart: unless-stopped
    environment:
      REMOTE_BIND: 0.0.0.0:8080
      REMOTE_JWT_SECRET: ${REMOTE_JWT_SECRET:?required}
      REMOTE_ADMIN_USER: ${REMOTE_ADMIN_USER:-admin}
      REMOTE_ADMIN_PASSWORD: ${REMOTE_ADMIN_PASSWORD:?required}
      REMOTE_DEVICE_TOKEN: ${REMOTE_DEVICE_TOKEN:?required}
      REMOTE_TURN_URLS: turn:${TURN_DOMAIN}:3478,turns:${TURN_DOMAIN}:5349
      REMOTE_TURN_SECRET: ${REMOTE_TURN_SECRET:?required}
      RUST_LOG: remote_signaling=info,tower_http=info
    networks: [remote]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [signaling]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [remote]

  coturn:
    image: coturn/coturn:4.6.3-r3-alpine
    restart: unless-stopped
    network_mode: host
    command:
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${REMOTE_TURN_SECRET}
      - --realm=${TURN_DOMAIN}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
      - --stale-nonce=600
      - --cert=/etc/coturn/certs/fullchain.pem
      - --pkey=/etc/coturn/certs/privkey.pem
    volumes:
      - ./coturn/certs:/etc/coturn/certs:ro

networks:
  remote:
