[workspace]
members = ["protocol", "signaling", "host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.10"
futures-util = "0.3"
postcard = { version = "1.1", features = ["alloc"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[patch.crates-io]
# Upstream submits every RTP packet through the peer-driver channel separately.
# A 4 MP H.264 frame contains dozens of packets, so that path starves a 60 FPS
# desktop stream. This local patch preserves upstream behavior but batches all
# packets belonging to one encoded frame into one ordered driver event.
webrtc = { path = "vendor/webrtc" }
